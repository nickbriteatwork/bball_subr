<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sub Planner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Subs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#131C2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>:root {
  --bg: #EEF1F6;
  --surface: #FFFFFF;
  --surface2: #F5F7FB;
  --ink: #131C2E;
  --ink2: #56617A;
  --line: #D9DFEA;
  --accent: #E8590C;
  --accent-ink: #FFFFFF;
  --accent-soft: #FDE7D9;
  --court: #F7E9D2;
  --court-line: #E3C79B;
  --good: #1E9E57;
  --warn: #D99A00;
  --bad: #D63A2F;
  --bad-soft: #FBE3E0;
  --nav: #131C2E;
  --shadow: 0 1px 2px rgba(19,28,46,.08), 0 6px 18px rgba(19,28,46,.06);
  --head: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", -apple-system, sans-serif;
  --body: "Barlow", -apple-system, "SF Pro Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B111C; --surface: #141C2C; --surface2: #1B2436; --ink: #ECF0F8; --ink2: #93A0BA; --line: #27324A;
    --accent: #FF7A33; --accent-ink: #1A0E05; --accent-soft: #3A2314;
    --court: #2A2418; --court-line: #5A4A2A; --good: #37C078; --warn: #F0B429; --bad: #FF6B5E; --bad-soft: #3B1B1A;
    --nav: #0F1626; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B111C; --surface: #141C2C; --surface2: #1B2436; --ink: #ECF0F8; --ink2: #93A0BA; --line: #27324A;
  --accent: #FF7A33; --accent-ink: #1A0E05; --accent-soft: #3A2314;
  --court: #2A2418; --court-line: #5A4A2A; --good: #37C078; --warn: #F0B429; --bad: #FF6B5E; --bad-soft: #3B1B1A;
  --nav: #0F1626; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.35;
  touch-action: manipulation; -webkit-text-size-adjust: 100%;
  padding-inline: 14px; padding-block: 12px 96px; max-width: 560px; margin-inline: auto;
}
button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num, .clock, .mins, .big { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.appbar { display: flex; align-items: baseline; justify-content: space-between; padding: 4px 2px 12px; gap: 12px; }
.appbar h1 { font-family: var(--head); font-weight: 700; font-size: 28px; letter-spacing: .02em; text-transform: uppercase; }
.appbar .sub { color: var(--ink2); font-size: 14px; }

.stack { display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.sec-title { font-family: var(--head); font-weight: 600; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); padding: 6px 2px 0; display: flex; justify-content: space-between; align-items: baseline; }
.muted { color: var(--ink2); }
.small { font-size: 13px; }
.row-flex { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; min-width: 0; }

/* buttons */
.btn { min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.wide { width: 100%; }
.btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; }
.btn:active { transform: translateY(1px); filter: brightness(.95); }
.btn[disabled] { opacity: .45; }

.seg { display: flex; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 40px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; font-size: 15px; padding: 0 8px; }
.seg button.on { background: var(--ink); color: var(--bg); }

/* form */
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .lbl { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; min-height: 46px; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface2);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
textarea { min-height: 120px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--nav); display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); z-index: 20; }
.tabs-in { display: flex; width: 100%; max-width: 560px; }
.tab { flex: 1; background: none; border: 0; color: #9AA6BF; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab.on { color: #FF8A4C; }

/* scoreboard */
.score { background: var(--nav); color: #F2F5FB; border-radius: 16px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; box-shadow: var(--shadow); }
.score .top { display: flex; justify-content: space-between; align-items: center; font-family: var(--head); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 15px; color: #B7C2D9; }
.score .top .pill { background: #24304A; border-radius: 999px; padding: 2px 10px; }
.clock { font-family: var(--head); font-weight: 700; font-size: 68px; line-height: .95; letter-spacing: .01em; text-align: center; }
.clock.run { color: #FFB27F; }
.score .ctl { display: flex; gap: 8px; }
.score .btn { flex: 1; }
.score .btn.ghost { background: #24304A; border-color: #24304A; color: #F2F5FB; }
.score .btn.primary { background: #FF7A33; border-color: #FF7A33; color: #1A0E05; }
.modebar { display: flex; gap: 8px; align-items: stretch; }
.modebar .seg { flex: 1; }

/* banner */
.banner { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--line); background: var(--surface); }
.banner.now { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(232,89,12,.25); } }
@media (prefers-reduced-motion: reduce) { .banner.now { animation: none; } }
.banner .bh { font-family: var(--head); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; display: flex; justify-content: space-between; }
.banner .bl { display: grid; grid-template-columns: 48px 1fr; gap: 4px 8px; font-size: 17px; font-weight: 500; }
.banner .bl em { font-style: normal; font-family: var(--head); font-weight: 700; letter-spacing: .08em; opacity: .75; align-self: center; }
.banner .bb { display: flex; gap: 8px; }
.banner.now .btn { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.4); color: inherit; }
.banner.now .btn.solid { background: #fff; color: #7A2E05; border-color: #fff; }
.banner.next .btn.solid { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.banner.idle { color: var(--ink2); font-size: 15px; }

/* player rows */
.list { display: flex; flex-direction: column; gap: 6px; }
.pl { display: grid; grid-template-columns: 44px 1fr auto 62px; align-items: center; gap: 10px; min-height: 58px; padding: 6px 12px 6px 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; width: 100%; }
.pl.on { background: var(--court); border-color: var(--court-line); }
.pl .num { font-family: var(--head); font-weight: 700; font-size: 30px; text-align: center; line-height: 1; }
.pl .who { display: flex; flex-direction: column; min-width: 0; }
.pl .who b { font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .who i { font-style: normal; font-size: 12px; color: var(--ink2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.pl .mins { font-family: var(--head); font-weight: 600; font-size: 24px; }
.pl .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.pl .bar s { display: block; height: 100%; border-radius: 4px; background: var(--good); }
.pl .bar s.warn { background: var(--warn); }
.pl .bar s.bad { background: var(--bad); }
.pl .fl { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
.pl .fl small { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); text-align: right; }
.pl.gone { opacity: .55; }
.chip { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; line-height: 18px; }
.chip.in { background: var(--good); color: #fff; }
.chip.out { background: var(--accent); color: var(--accent-ink); }
.chip.foul { background: var(--surface2); color: var(--ink); border: 1px solid var(--line); }
.chip.foul.hot { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.chip.tired { background: var(--bad-soft); color: var(--bad); }
.chip.gone { background: var(--surface2); color: var(--ink2); border: 1px solid var(--line); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgba(8,12,22,.55); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 20px 20px 0 0; z-index: 41; padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); align-self: center; }
.sheet h2 { font-family: var(--head); font-size: 26px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; }
.opt { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; min-height: 54px; padding: 6px 12px 6px 4px; border: 1px solid var(--line); background: var(--surface2); border-radius: 12px; width: 100%; text-align: left; }
.opt .num { font-family: var(--head); font-weight: 700; font-size: 26px; text-align: center; }
.opt .meta { font-size: 13px; color: var(--ink2); }
.opt.best { border-color: var(--accent); background: var(--accent-soft); }
.menu-btn { justify-content: flex-start; }
.toast { position: fixed; left: 14px; right: 14px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); max-width: 532px; margin-inline: auto; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; align-items: center; gap: 8px; z-index: 30; box-shadow: var(--shadow); font-weight: 500; }
.toast span { flex: 1; }
.toast button { background: transparent; border: 1px solid currentColor; color: inherit; border-radius: 8px; min-height: 34px; padding: 0 12px; font-weight: 600; }

/* plan grid */
.gridwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.g { border-collapse: separate; border-spacing: 0; font-size: 13px; width: 100%; }
table.g th, table.g td { padding: 0; height: 40px; text-align: center; border-bottom: 1px solid var(--line); }
table.g thead th { position: sticky; top: 0; font-family: var(--head); font-size: 12px; letter-spacing: .04em; line-height: 1.05; padding: 6px 2px; height: auto; background: var(--surface2); color: var(--ink2); min-width: 34px; white-space: nowrap; }
table.g th.nm, table.g td.nm { position: sticky; left: 0; background: var(--surface); text-align: left; padding: 0 8px; min-width: 104px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; line-height: 1.15; z-index: 2; border-right: 1px solid var(--line); }
table.g thead th.nm { background: var(--surface2); }
table.g td.c { background: var(--surface); border-left: 1px solid var(--line); }
table.g td.c.on { background: var(--accent); }
table.g td.c.past.on { background: var(--court-line); }
table.g td.c.cur { box-shadow: inset 0 0 0 2px var(--ink); }
table.g td.tot { font-family: var(--head); font-weight: 600; font-size: 15px; padding: 0 8px; border-left: 1px solid var(--line); white-space: nowrap; }
.sched { display: flex; flex-direction: column; gap: 0; }
.sched > div { display: grid; grid-template-columns: 74px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.sched > div:last-child { border-bottom: 0; }
.sched b { font-family: var(--head); font-size: 16px; }
.sched em { font-style: normal; font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); margin-right: 4px; }

/* season */
.srow { display: grid; grid-template-columns: 34px 1fr 92px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); background: none; border-inline: 0; border-top: 0; width: 100%; text-align: left; }
.srow:last-child { border-bottom: 0; }
.srow .num { font-family: var(--head); font-weight: 700; font-size: 24px; text-align: center; }
.srow .bars { height: 10px; background: var(--surface2); border-radius: 5px; position: relative; margin-top: 4px; }
.srow .bars s { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 5px; }
.srow .bars u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.srow .r { text-align: right; font-family: var(--head); font-weight: 600; font-size: 22px; line-height: 1; }
.srow .r small { display: block; font-family: var(--body); font-size: 12px; font-weight: 500; }
.owed-pos { color: var(--good); } .owed-neg { color: var(--bad); }
.stars { letter-spacing: 1px; color: var(--accent); font-size: 14px; }
.hero { display: flex; flex-direction: column; gap: 12px; }
.hero h2 { font-family: var(--head); font-size: 34px; line-height: 1; font-weight: 700; text-transform: uppercase; }
.pstate { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.pstate .num { font-family: var(--head); font-weight: 700; font-size: 26px; text-align: center; }
.pstate .seg { width: 176px; }
.pstate .seg button { min-height: 36px; font-size: 13px; padding: 0 4px; }
.pstate .seg button.on.st { background: var(--accent); color: var(--accent-ink); }
.pstate .seg button.on.ab { background: var(--ink2); color: var(--bg); }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.note.bad { background: var(--bad-soft); color: var(--bad); }

table.g td.nm small { display: block; font-weight: 500; font-size: 11px; color: var(--ink2); }

.nudge { display: flex; gap: 8px; }
.nudge .btn { flex: 1; min-height: 36px; font-size: 14px; }
.score .btn.ghost[disabled] { opacity: .35; }
.banner.brk { background: var(--surface); border: 2px solid var(--accent); }
.banner.brk .bh { color: var(--accent); }
.banner.brk .five { display: flex; flex-wrap: wrap; gap: 6px; }
.banner.brk .five span { background: var(--court); border: 1px solid var(--court-line); border-radius: 8px; padding: 4px 10px; font-weight: 600; font-size: 16px; }
.banner.brk .five b { font-family: var(--head); font-size: 18px; margin-right: 2px; }
.banner.brk .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.clockrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.clockrow .clock { flex: 1; }
.nb { width: 66px; min-height: 52px; border-radius: 12px; border: 1px solid #24304A; background: #24304A; color: #F2F5FB; font-family: var(--head); font-weight: 700; font-size: 20px; line-height: 1.05; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.nb small { font-family: var(--body); font-weight: 600; font-size: 11px; color: #B7C2D9; letter-spacing: .02em; }
.nb[disabled] { opacity: .35; }

.pill-btn { max-width: 58%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; }

.grid2, .grid3 { align-items: end; }

/* court */
.court { position: relative; width: 100%; aspect-ratio: 54 / 98; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: var(--court); container-type: inline-size; touch-action: pan-y; }
.court svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.court .tok, .court .spot { position: absolute; transform: translate(-50%, -50%); width: 12.6%; aspect-ratio: 1; border-radius: 50%; padding: 0; }
.court .spot { border: 2px dashed var(--ink2); background: transparent; opacity: .55; }
.court .spot.target { opacity: 1; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }
.tok { border-radius: 50%; border: 2px solid var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; font-family: var(--head); }
.tok b { font-size: 20px; font-size: 5.6cqw; line-height: 1; font-weight: 700; pointer-events: none; }
.tok i { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 1px; font-style: normal; font-family: var(--body); font-weight: 600; font-size: 11px; font-size: 2.9cqw; line-height: 1.1; color: var(--ink); background: color-mix(in srgb, var(--surface) 80%, transparent); border-radius: 4px; padding: 0 3px; white-space: nowrap; max-width: 17cqw; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.tok.tall { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tok.mid { background: var(--nav); border-color: var(--nav); }
.tok.short { background: #1F8A8A; border-color: #1F8A8A; }
.tok.sel { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
.tok.drag { z-index: 5; opacity: .9; cursor: grabbing; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.tray { display: flex; flex-wrap: wrap; gap: 26px 14px; padding: 4px 4px 22px; }
.tok.inline { position: relative; width: 56px; height: 56px; transform: none; }
.tok.inline b { font-size: 22px; }
.tok.inline i { font-size: 11px; max-width: 70px; }
.crow { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.crow .seg { width: 150px; }
.crow .seg button { min-height: 34px; font-size: 13px; }

body{padding-top:calc(12px + env(safe-area-inset-top,0px))}
[hidden]{display:none!important}</style>

<script>/* ============================================================
   Sub Planner engine: pure logic, no DOM.
   Time is measured in game seconds (absolute, across periods).
   ============================================================ */
var Engine = (function () {
  'use strict';

  var RECOVERY = 1.5; // bench rest recovers fatigue 1.5x faster than court time builds it

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }
  function mean(a) { var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return a.length ? s / a.length : 0; }
  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Ideal lineup height total: about 60% of the floor from the taller half of the roster, the rest from the shorter half.
  function heightTarget(hgt, C) {
    var sorted = hgt.slice().sort(function (a, b) { return b - a; });
    var nBig = Math.ceil(sorted.length / 2), big = sorted.slice(0, nBig), small = sorted.slice(nBig);
    var HB = mean(big), HS = small.length ? mean(small) : HB, k = Math.ceil(C * 0.6);
    return k * HB + (C - k) * HS;
  }

  /* ---- plan tab ---- */
  function planView(g) {
    var h = '<div class="appbar"><h1>Plan</h1>' + teamPill() + '</div>';

    var plan = g.status === 'live' ? g._plan : previewPlan(g);

    var tau = g.status === 'live' ? tauNow(g) : 0;
    var st = g.status === 'live' ? Engine.derive(g, tau).P : {};
    var ids = Object.keys(plan.proj);
    ids.sort(function (a, b) { return (parseInt(pl(a).num, 10) || 0) - (parseInt(pl(b).num, 10) || 0); });
    var vals = ids.map(function (i) { return plan.proj[i]; });

        (mx - mn > 150 && (g.cfg.subsMax < 6 || g.cfg.maxSwap < 5) ? '<br><span class="small muted">The gap comes from the limits on subs. More subs per ' + (g.cfg.format === 'halves' ? 'half' : 'quarter') + ' or more players per sub narrows it.</span>' : '') +
        (plan.subsPer != null && plan.subsPer !== g.cfg.subsPer ? '<br><span class="small muted">Using ' + plan.subsPer + ' subs per ' + (g.cfg.format === 'halves' ? 'half' : 'quarter') + ' instead of the usual ' + g.cfg.subsPer + ' to keep court time closer to equal.</span>' : '') + (sitsNote(g, plan) ? '<span class="small muted">' + sitsNote(g, plan).replace(/^<br>/, '') + '</span>' : '') + '</div>';

  /* ---- season tab ---- */
  function seasonStats() {

        var s = S[id] || (S[id] = { gp: 0, sec: 0, fouls: 0, starts: 0, sits: 0, games: [] });
        s.gp++; s.sec += P[id].played; s.fouls += P[id].fouls;
        if ((g.starters || []).indexOf(id) >= 0) s.starts++;
        s.games.push({ g: g, played: P[id].played, fouls: P[id].fouls, avail: P[id].avail, status: P[id].status });
      }
      var sc = Engine.sitHistory(g, g.finalTau).count;
      Object.keys(sc).forEach(function (id) { if (S[id]) S[id].sits += sc[id]; });
    });
    return { S: S, n: done.length, done: done };
  }
  /* ---- game awards and MVP table ---- */
  var AWARDS = [['first', 3, 'Player of the week', 'Player of the week · 3 points'], ['second', 2, 'Second best', 'Second best · 2 points'], ['third', 1, 'Third best', 'Third best · 1 point']];
  function mvpStats() {
    var S = {}, games = teamGames().filter(function (g) { return g.status === 'done'; });
    function row(id) { return S[id] || (S[id] = { pts: 0, first: 0, second: 0, third: 0, assists: 0, team: 0 }); }
    var teamPts = 0;
    games.forEach(function (g) {
      if (!g.awards) return;
      if (g.awards.team) {
        teamPts++;
        Object.keys(Engine.derive(g, g.finalTau).P).forEach(function (id) { var r = row(id); r.pts += 1; r.team++; });
      }
      AWARDS.forEach(function (a) {
        var w = g.awards[a[0]]; if (!w) return;
        if (w.p) { var r = row(w.p); r.pts += a[1]; r[a[0]]++; }
        if (w.a) { var q = row(w.a); q.pts += 1; q.assists++; }
      });
    });
    return { S: S, games: games, teamPts: teamPts };
  }
  function awardsSet(g) { return !!(g.awards && (g.awards.team || (g.awards.first && g.awards.first.p) || (g.awards.second && g.awards.second.p) || (g.awards.third && g.awards.third.p))); }
  function awardSummary(g) {
    if (!g.awards || !g.awards.first || !g.awards.first.p) return '';

  }

    h += '<div class="card"><b>MVP table</b><br><span class="small muted">Best player 3 points, second 2, third 1, plus 1 point for each assist. You can also give the whole team 1 point for a good game. Set the awards when you end a game, or from a game below.</span></div>';

  // A player can only take one of the three places, so once chosen they drop out of the other two lists.

      var g = activeGame(), M = liveModel(g), pd = M.pd; if (!pd) return;
      if (!pd.now && pd.per > g.clock.per) return; // changes for the next period wait for the break
      var evs = [];
      pd.outs.forEach(function (id) { evs.push({ type: 'out', p: id }); });
      pd.ins.forEach(function (id) { evs.push({ type: 'in', p: id }); });
      rec(g, evs); advancePlan(g, pd); save(); showToast('Subs made', true);
    },
    skip: function () { var g = activeGame(); replan(g, { pinCurrent: true }); save(); render(); },
    sound: function (d) { DB.sound = d.v === '1'; save(); render(); if (DB.sound) { ensureAudio(); beep(1); } },
    addp: function () { openPlayerEdit(null); },
    editp: function (d) { openPlayerEdit(d.id); },
    rate: function (d) {
      UI.editRating = Number(d.v);
      document.querySelectorAll('#ep-rate button').forEach(function (b) { b.className = Number(b.dataset.v) === UI.editRating ? 'on' : ''; });
    },
    hrate: function (d) {
      UI.editHeight = Number(d.v);
      document.querySelectorAll('#ep-height button').forEach(function (b) { b.className = Number(b.dataset.v) === UI.editHeight ? 'on' : ''; });
    },
    savep: function (d) {
      var name = $('#ep-name').value.trim(), num = $('#ep-num').value.trim();
      if (!name) { showToast('Enter a name'); return; }
      if (d.id) { var p = pl(d.id); p.name = name; p.num = num || p.num; p.rating = UI.editRating; p.height = UI.editHeight; }
      else { var np = { id: uid(), name: name, num: num || String(players().length + 1), rating: UI.editRating, height: UI.editHeight }; team().players.push(np); var g = activeGame(); if (g && g.status === 'setup') { g.present.push(np.id); } }
      save(); closeSheet(); render();
    },
    removep: function (d) { confirmSheet('Remove ' + pl(d.id).name + '?', 'They leave the roster. Their past games stay in the season.', 'removep2', 'data-id="' + d.id + '"', 'Remove'); },
    removep2: function (d) {
      var p = pl(d.id); p.archived = true;
      var g = activeGame(); if (g && g.status === 'setup') { g.present = g.present.filter(function (x) { return x !== d.id; }); g.starters = g.starters.filter(function (x) { return x !== d.id; }); }
      save(); closeSheet(); render();
    },
    box: function (d) { openBox(d.id); },
    stab: function (d) { UI.stab = d.v; render(); },
    creset: function () { var g = activeGame(); g.form = defaultForm(courtLineup(g)); save(); render(); },
    teampt: function (d) {
      UI.awardTeam = d.v === '1';
      document.querySelectorAll('#aw-team button').forEach(function (b) { b.className = (b.dataset.v === '1') === UI.awardTeam ? 'on' : ''; });
    },
    awards: function (d) { openAwards(d.id); },
    saveaw: function (d) {
      var g = DB.games.filter(function (x) { return x.id === d.id; })[0]; if (!g) return;
      var aw = { team: !!UI.awardTeam }, seen = {}, bad = null;
      AWARDS.forEach(function (a) {
        var p = $('#aw-' + a[0] + '-p').value, as = $('#aw-' + a[0] + '-a').value;
        if (p) { if (seen[p]) bad = pl(p).name + ' can only be given one place'; seen[p] = 1; }
        if (as && as === p) bad = pl(as).name + ' cannot assist their own award';
        if (as && !p) bad = 'Choose a player for ' + a[2].toLowerCase() + ' before adding an assist';
        aw[a[0]] = { p: p || null, a: as || null };
      });
      if (bad) { showToast(bad); return; }
      g.awards = aw; save(); closeSheet(); render(); showToast('Awards saved');
    },
    delgame: function (d) { confirmSheet('Delete this game?', 'It is removed from the season totals.', 'delgame2', 'data-id="' + d.id + '"', 'Delete game'); },
    delgame2: function (d) { DB.games = DB.games.filter(function (g) { return g.id !== d.id; }); recomputeOwe(); save(); closeSheet(); render(); },
    sp: function (d) { openSeasonPlayer(d.id); },
    backup: function () { openBackup(); },
    copybk: function () {
      var ta = $('#bk-out');
      function fallback() { ta.select(); try { document.execCommand('copy'); showToast('Copied'); } catch (e) { showToast('Select the text and copy it'); } }
      try { navigator.clipboard.writeText(ta.value).then(function () { showToast('Copied'); }, fallback); } catch (e) { fallback(); }
    },
    sharebk: function () { try { navigator.share({ title: 'Sub planner backup', text: $('#bk-out').value }); } catch (e) { } },
    restorebk: function () {
      var t = $('#bk-in').value.trim();
      try { var d = JSON.parse(t); if (!d || !(d.teams || d.team) || !d.games) throw 0; } catch (e) { showToast('That does not look like a backup'); return; }
      confirmSheet('Replace all data?', 'Your current roster and games are overwritten with the backup.', 'restore2', '', 'Restore backup');
      UI.pendingRestore = t;
    },
    restore2: function () {
      try { var nd = migrate(JSON.parse(UI.pendingRestore)); if (!nd) throw 0; DB = nd; save(); recomputeOwe(); closeSheet(); render(); showToast('Backup restored'); } catch (e) { showToast('Restore failed'); }
    }
  };
  // keep starters valid when rules change during setup
  function autoStartersKeep(g) {
    var cap = Math.min(g.cfg.onCourt, g.present.length);
    if (g.starters.length !== cap) autoStarters(g);
  }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]'); if (!t) return;
    var fn = H[t.dataset.act]; if (!fn) return;
    if (t.dataset.act === 'undo' && t.closest('.toast')) { var g = activeGame(); UI.toast = null; if (g) undo(g); return; }
    e.preventDefault(); fn(t.dataset, t);
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id && t.id.indexOf('aw-') === 0 && UI.awardIds) { refreshAwards(false); return; }
    if (t.dataset.cfg) { H.cfg({ scope: t.dataset.scope, k: t.dataset.cfg, v: t.value }); return; }
    if (t.dataset.game) { var g = activeGame(); if (g) { g[t.dataset.game] = t.value; save(); } return; }
    if (t.dataset.team) { team()[t.dataset.team] = t.value; save(); }
  });

  /* ---------------- boot ---------------- */
  recomputeOwe();
  (function boot() {
    var g = activeGame();
    if (g && g.status === 'live') { replan(g); if (g.clock.run && clockElapsed(g) >= g.lens[g.clock.per]) endPeriod(g, false); }
    render();
    setInterval(tick, 250);
  })();
  window.SP = { DB: function () { return DB; }, H: H, render: render, activeGame: activeGame, tauNow: tauNow, UI: UI, reset: function () { DB = blank(); save(); recomputeOwe(); render(); } };
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
